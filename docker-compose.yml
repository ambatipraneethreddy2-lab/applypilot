# Run the whole stack locally:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot
      POSTGRES_DB: applypilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://applypilot:applypilot@db:5432/applypilot
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
